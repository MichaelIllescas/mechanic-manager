      - Órdenes de trabajo
      summary: Historial detallado
      description: "Órdenes de trabajo con sus ítems, de la más reciente a la más\
        \ antigua, de un cliente o de un vehículo. Se debe indicar exactamente uno\
        \ de los dos."
      operationId: findHistory
      parameters:
      - name: customerId
        in: query
        description: Identificador de cliente
        required: false
        schema:
          type: integer
          format: int64
      - name: vehicleId
        in: query
        description: Identificador de vehículo
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Historial obtenido correctamente
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrderResponse"
        "400":
          description: "Debe indicarse customerId o vehicleId, no ambos"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
