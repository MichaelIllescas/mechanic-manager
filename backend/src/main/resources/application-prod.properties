# ============================================================
# Perfil PROD - servidor.
# SIN valores por defecto a proposito: si falta una variable
# de entorno la app no arranca, en vez de arrancar mal configurada.
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# En el servidor la base ya existe, no la levanta docker-compose
spring.docker.compose.enabled=false

security.jwt.secret=${JWT_SECRET}

# Ej: https://panel.tudominio.com,https://www.tudominio.com
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Administrador inicial. La migracion V2 siembra una cuenta con clave publica;
# en prod se deshabilita y se reemplaza por esta. Sin valores, la app no arranca.
app.bootstrap-admin.email=${ADMIN_EMAIL}
app.bootstrap-admin.password=${ADMIN_PASSWORD}

# La documentacion de la API no se expone en produccion.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Detras de un proxy inverso, toma la IP real del cliente de X-Forwarded-For
# (solo si el proxy es de confianza: por defecto rangos privados/loopback).
# El limite de intentos de login usa esa IP.
server.forward-headers-strategy=native
