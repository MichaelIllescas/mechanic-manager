openapi: 3.1.0
info:
  title: Mechanic Manager API
  description: API REST del micro SaaS de gestión para talleres mecánicos.
  version: 1.0.0
servers:
- url: /
  description: Mismo servidor que sirve esta documentación
security:
- bearerAuth: []
tags:
- name: Vehículos
  description: Gestión de los vehículos pertenecientes al taller del usuario autenticado.
- name: Taller
  description: |
    Datos del taller del usuario autenticado.

    El taller se crea vacío junto con la cuenta, por lo que todos sus
    campos pueden venir en null hasta que el usuario los complete.
- name: Dashboard
  description: Resumen operativo del taller autenticado
- name: Turnos
  description: Agenda de turnos del taller del usuario autenticado. Un turno se agenda
    sobre un vehículo y el cliente se deduce de él.
- name: Clientes
  description: Gestión de los clientes pertenecientes al taller del usuario autenticado.
- name: Órdenes de trabajo
  description: Historial de trabajos realizados sobre los vehículos del usuario autenticado
- name: Autenticación
  description: Obtención del token de acceso a la API.
- name: Usuarios
  description: |
    Administración de las cuentas de usuario de la plataforma.

    Todos los endpoints requieren un usuario autenticado con rol SYSTEM_ADMIN.
- name: Catálogo de insumos
  description: |
    Insumos y repuestos que utiliza el taller: aceite, filtros, pastillas, bujías.

    Es catálogo, no existencias. Cuántas unidades hay en el taller queda fuera
    del MVP: acá sólo vive el material y su precio de referencia.

    Los insumos no se eliminan: se desactivan, para no romper el historial
    de presupuestos y órdenes que los referencian.
- name: Presupuestos
  description: Gestión de presupuestos del usuario autenticado
- name: Catálogo de servicios
  description: |
    Servicios que ofrece el taller: cambio de aceite, alineación, cambio de pastillas.

    Es catálogo, no trabajo realizado. El trabajo efectivamente ejecutado sobre
    un vehículo se registra en las órdenes de trabajo.

    Los servicios no se eliminan: se desactivan, para no romper el historial
    de presupuestos y órdenes que los referencian.
paths:
  /api/v1/workshops/me:
    get:
      tags:
      - Taller
      summary: Obtener el taller propio
      description: Devuelve los datos del taller asociado al usuario autenticado.
      operationId: findMine
      responses:
        "200":
          description: Taller obtenido correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkshopResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no tiene un taller asociado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Taller
      summary: Actualizar el taller propio
      description: |
        Actualiza los datos del taller del usuario autenticado.

        Todos los campos son opcionales: se puede guardar el taller
        parcialmente cargado. Los campos enviados vacíos se guardan como null.
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkshopRequest"
        required: true
      responses:
        "200":
          description: Taller actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkshopResponse"
        "400":
          description: Alguno de los campos enviados tiene un formato inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no tiene un taller asociado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/work-orders/{id}:
    get:
      tags:
      - Órdenes de trabajo
      summary: Obtener una orden de trabajo
      operationId: findById
      parameters:
      - name: id
        in: path
        description: Identificador de la orden de trabajo
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Orden de trabajo obtenida correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkOrderResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Orden de trabajo no encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Órdenes de trabajo
      summary: Actualizar una orden de trabajo
      operationId: update_1
      parameters:
      - name: id
        in: path
        description: Identificador de la orden de trabajo
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkOrderRequest"
        required: true
      responses:
        "200":
          description: Orden de trabajo actualizada correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkOrderResponse"
        "400":
          description: Datos o relaciones inválidas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Orden de trabajo o referencia no encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Órdenes de trabajo
      summary: Eliminar una orden de trabajo
      description: "Baja definitiva: no queda registro en el historial del vehículo."
      operationId: delete
      parameters:
      - name: id
        in: path
        description: Identificador de la orden de trabajo
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Orden de trabajo eliminada correctamente
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Orden de trabajo no encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/vehicles/{id}:
    put:
      tags:
      - Vehículos
      summary: Editar un vehículo
      description: Solo permite editar vehículos y asociar clientes del taller autenticado.
      operationId: update_2
      parameters:
      - name: id
        in: path
        description: Identificador del vehículo
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleRequest"
        required: true
      responses:
        "200":
          description: Vehículo actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El vehículo o el cliente no existe en el taller
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La patente ya existe en el taller
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/supplies/{id}:
    get:
      tags:
      - Catálogo de insumos
      summary: Obtener un insumo
      description: Devuelve un insumo del catálogo del usuario autenticado.
      operationId: findById_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Insumo obtenido correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupplyResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No se encontró el insumo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Catálogo de insumos
      summary: Actualizar un insumo
      description: |
        Actualiza el nombre y el precio.

        Modificar el precio no altera los presupuestos ni las órdenes ya
        registrados: esos conservan el valor que tenían al crearse.
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplyRequest"
        required: true
      responses:
        "200":
          description: Insumo actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupplyResponse"
        "400":
          description: Alguno de los campos enviados tiene un formato inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No se encontró el insumo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ya existe otro insumo con ese nombre
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/service-types/{id}:
    get:
      tags:
      - Catálogo de servicios
      summary: Obtener un servicio
      description: Devuelve un servicio del catálogo del usuario autenticado.
      operationId: findById_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Servicio obtenido correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceTypeResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No se encontró el servicio
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Catálogo de servicios
      summary: Actualizar un servicio
      description: |
        Actualiza el nombre, la descripción, el precio y la duración estimada.

        Modificar el precio no altera los presupuestos ni las órdenes ya
        registrados: esos conservan el valor que tenían al crearse.
      operationId: update_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceTypeRequest"
        required: true
      responses:
        "200":
          description: Servicio actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceTypeResponse"
        "400":
          description: Alguno de los campos enviados tiene un formato inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No se encontró el servicio
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ya existe otro servicio con ese nombre
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/quotes/{id}:
    get:
      tags:
      - Presupuestos
      summary: Obtener un presupuesto
      operationId: findById_3
      parameters:
      - name: id
        in: path
        description: Identificador del presupuesto
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Presupuesto obtenido correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Presupuesto no encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Presupuestos
      summary: Actualizar un presupuesto
      description: Permite corregir el presupuesto independientemente de su estado.
      operationId: update_5
      parameters:
      - name: id
        in: path
        description: Identificador del presupuesto
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuoteRequest"
        required: true
      responses:
        "200":
          description: Presupuesto actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "400":
          description: Datos o relaciones inválidas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Presupuesto o referencia no encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Presupuestos
      summary: Eliminar un presupuesto
      description: Elimina el presupuesto y conserva el turno y el trabajo realizado
        vinculados.
      operationId: delete_1
      parameters:
      - name: id
        in: path
        description: Identificador del presupuesto
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Presupuesto eliminado correctamente
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Presupuesto no encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/customers/{id}:
    put:
      tags:
      - Clientes
      summary: Editar un cliente
      description: Solo permite editar clientes que pertenezcan al taller del usuario
        autenticado.
      operationId: update_6
      parameters:
      - name: id
        in: path
        description: Identificador del cliente
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
        required: true
      responses:
        "200":
          description: Cliente actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El cliente no existe en el taller autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/appointments/{id}:
    get:
      tags:
      - Turnos
      summary: Consultar un turno por identificador
      description: "La agenda se consulta por rango, pero reprogramar parte de un\
        \ id."
      operationId: findById_4
      parameters:
      - name: id
        in: path
        description: Identificador del turno
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Turno obtenido correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El turno no existe en el taller
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Turnos
      summary: Reprogramar un turno
      description: "Modifica fecha y notas de un turno agendado. El vehículo no se\
        \ cambia: si el turno se cargó sobre el auto equivocado se cancela y se crea\
        \ otro."
      operationId: update_7
      parameters:
      - name: id
        in: path
        description: Identificador del turno
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentRequest"
        required: true
      responses:
        "200":
          description: Turno actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El turno no existe en el taller
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El turno ya está completado o cancelado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Turnos
      summary: Eliminar un turno
      description: "Baja definitiva, en cualquier estado. El presupuesto vinculado\
        \ y la orden de trabajo autogenerada (si existen) no se borran: quedan sin\
        \ turno."
      operationId: delete_2
      parameters:
      - name: id
        in: path
        description: Identificador del turno
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Turno eliminado correctamente
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no tiene rol USER
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El turno no existe en el taller
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users/{id}:
    get:
      tags:
      - Usuarios
      summary: Obtener un usuario
      description: Devuelve los datos de una cuenta a partir de su identificador.
      operationId: findById_5
      parameters:
      - name: id
        in: path
        description: Identificador del usuario
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Usuario encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no es SYSTEM_ADMIN
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe un usuario con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Usuarios
      summary: Actualizar un usuario
      description: |
        Modifica el nombre, el email y el rol de una cuenta.

        No modifica la contraseña ni el estado. Cambiar el email invalida la sesión
        activa del usuario, porque el token se emite contra su email.
      operationId: update_8
      parameters:
      - name: id
        in: path
        description: Identificador del usuario
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: Usuario actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no es SYSTEM_ADMIN
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe un usuario con ese id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El email ya pertenece a otro usuario
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/work-orders:
    get:
      tags:
      - Órdenes de trabajo
      summary: Buscar órdenes de trabajo
      description: "Busca por cliente o patente y permite filtrar por estado, vehí\
        culo y rango de fechas."
      operationId: findAll
      parameters:
      - name: search
        in: query
        description: Nombre del cliente o patente
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Estado opcional
        required: false
        schema:
          type: string
          enum:
          - COMPLETED
          - CANCELLED
      - name: vehicleId
        in: query
        description: Identificador de vehículo opcional
        required: false
        schema:
          type: integer
          format: int64
