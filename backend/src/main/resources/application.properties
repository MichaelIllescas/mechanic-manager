spring.application.name=mechanic-manager

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mechanic_manager}
spring.datasource.username=${DB_USERNAME:mechanic_manager}
spring.datasource.password=${DB_PASSWORD:mechanic_manager_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
