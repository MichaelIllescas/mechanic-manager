  /api/v1/auth/reset-password:
    post:
      tags:
      - Autenticación
      summary: Restablecer contraseña
      description: |
        Cambia la contraseña usando el token recibido por email.

        El token es de un solo uso y vence a los pocos minutos.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: Contraseña actualizada
        "400":
          description: Datos inválidos o enlace vencido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Demasiados intentos con enlaces inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: |
        Valida las credenciales y devuelve un token JWT.

        El token se envía en las siguientes peticiones mediante la cabecera
        Authorization con el prefijo Bearer. El email no distingue mayúsculas.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Autenticación correcta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email o contraseña incorrectos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: La cuenta está deshabilitada (solo se informa si la contraseña
            es correcta)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Demasiados intentos fallidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Autenticación
      summary: Solicitar recuperación de contraseña
      description: |
        Envía por email un enlace para elegir una contraseña nueva.

        El envío se encola y la respuesta no espera al servidor de correo.

        La respuesta es siempre 204, exista o no una cuenta con ese email:
        el endpoint es público y no debe revelar qué direcciones están
        registradas. Cada pedido invalida los enlaces anteriores.
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "204":
