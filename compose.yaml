services:
  mysql:
    image: mysql:8.4
    container_name: mechanic-manager-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mechanic_manager
      MYSQL_USER: mechanic_manager
      MYSQL_PASSWORD: mechanic_manager_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mechanic_manager_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: mechanic-manager-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mechanic_manager_mysql_data:
