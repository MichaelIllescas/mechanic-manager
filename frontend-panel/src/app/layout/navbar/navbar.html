<header class="navbar">
  <a
    class="navbar__brand"
    [routerLink]="homePath()"
    aria-label="Ir al inicio"
    (click)="closeMenus()"
  >
    <img
      class="navbar__logo"
      src="/assets/Logo-mechanic.jpeg"
      alt="Logo de Mechanic Manager"
    />
  </a>

  <button
    class="navbar__toggle"
    type="button"
    aria-label="Abrir o cerrar el menú"
    aria-controls="main-navigation"
    [attr.aria-expanded]="isMenuOpen"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div
    id="main-navigation"
    class="navbar__navigation"
    [class.navbar__navigation--open]="isMenuOpen"
  >
    <nav class="navbar__menu" aria-label="Navegación principal">
      @for (link of links(); track link.path) {
        <a
          [href]="link.path"
          [class.navbar__link--active]="isLinkActive(link)"
          (click)="navigateTo($event, link.path)"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="navbar__profile-menu">
      <button
        class="navbar__profile"
        type="button"
        aria-haspopup="menu"
        [attr.aria-expanded]="isProfileMenuOpen"
        (click)="toggleProfileMenu()"
      >
        <span class="navbar__avatar" aria-hidden="true">{{ userInitial }}</span>
        <span class="navbar__profile-label">{{ userName }}</span>
        <svg
          class="navbar__chevron"
          [class.navbar__chevron--open]="isProfileMenuOpen"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      <div
        class="navbar__profile-dropdown"
        [class.navbar__profile-dropdown--open]="isProfileMenuOpen"
        role="menu"
      >
        <button type="button" role="menuitem" (click)="navigateTo($event, '/workshop')">
          Datos del taller
        </button>
        <button type="button" role="menuitem" (click)="navigateTo($event, '/mi-cuenta')">
          Cambiar contraseña
        </button>
        <div class="navbar__profile-divider"></div>
        <button
          class="navbar__logout"
          type="button"
          role="menuitem"
          (click)="logout()"
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</header>
