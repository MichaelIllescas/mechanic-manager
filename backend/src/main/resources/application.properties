# ============================================================
# Configuracion COMUN a todos los entornos.
# Lo que cambia entre dev y prod vive en:
#   - application-dev.properties
#   - application-prod.properties
# ============================================================

spring.application.name=mechanic-manager

# Perfil activo. En prod se sobreescribe con SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.config.import=optional:file:./.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Zona horaria de la aplicacion. Todas las fechas se guardan y se muestran en
# hora local del taller. Se aplica a la JVM (ver MechanicManagerApplication),
# al reloj de la app y a la sesion de MySQL, para que created_at/updated_at,
# generados por la base, coincidan con las fechas que calcula la app.
app.time-zone=${APP_TIME_ZONE:America/Argentina/Buenos_Aires}
spring.datasource.hikari.data-source-properties.connectionTimeZone=${app.time-zone}
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Envio de emails (SMTP)
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Datos del remitente y link de recuperacion
app.mail.from-name=${MAIL_FROM_NAME:Mechanic Manager}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
app.frontend.reset-password-path=${FRONTEND_RESET_PASSWORD_PATH:/reset-password}

# Minutos de validez del enlace de recuperacion de contrasena
security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}