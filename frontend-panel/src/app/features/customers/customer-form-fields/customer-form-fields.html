<section class="customer-form-card" aria-labelledby="customer-form-title">
  @if (showHeader()) {
    <div class="customer-form-card__header">
      <div class="customer-form-card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" />
        </svg>
      </div>

      <div>
        <span class="customer-form-card__mode">
          {{ isEdit() ? 'Modo edición' : 'Modo alta' }}
        </span>
        <h2 id="customer-form-title">Datos del cliente</h2>
      </div>
    </div>
  }

  @if (loading()) {
    <p class="customer-form__loading">Cargando datos del cliente...</p>
  } @else {
    <form class="customer-form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-grid">
        <label class="field">
          <span>Nombre <span class="field__required" aria-hidden="true">*</span></span>
          <input
            type="text"
            formControlName="firstName"
            placeholder="Juan"
            autocomplete="off"
            required
            [attr.aria-invalid]="form.controls.firstName.touched && form.controls.firstName.invalid"
            [attr.aria-describedby]="
              form.controls.firstName.touched && form.controls.firstName.invalid
                ? 'first-name-error'
                : null
            "
          />
          @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
            <small id="first-name-error" class="field__error" aria-live="polite">
              @if (form.controls.firstName.hasError('required')) {
                El nombre es obligatorio.
              } @else {
                El nombre no puede superar los 120 caracteres.
              }
            </small>
          }
        </label>

        <label class="field">
          <span>Apellido <span class="field__required" aria-hidden="true">*</span></span>
          <input
            type="text"
            formControlName="lastName"
            placeholder="Pérez"
            autocomplete="off"
            required
            [attr.aria-invalid]="form.controls.lastName.touched && form.controls.lastName.invalid"
            [attr.aria-describedby]="
              form.controls.lastName.touched && form.controls.lastName.invalid
                ? 'last-name-error'
                : null
            "
          />
          @if (form.controls.lastName.touched && form.controls.lastName.invalid) {
            <small id="last-name-error" class="field__error" aria-live="polite">
              @if (form.controls.lastName.hasError('required')) {
                El apellido es obligatorio.
              } @else {
                El apellido no puede superar los 120 caracteres.
              }
            </small>
          }
        </label>

        <label class="field">
          <span>DNI o documento</span>
          <input
            type="text"
            formControlName="documentNumber"
            placeholder="30111222"
            autocomplete="off"
            [attr.aria-invalid]="
              form.controls.documentNumber.touched && form.controls.documentNumber.invalid
            "
            [attr.aria-describedby]="
              form.controls.documentNumber.touched && form.controls.documentNumber.invalid
                ? 'document-number-error'
                : null
            "
          />
          @if (form.controls.documentNumber.touched && form.controls.documentNumber.invalid) {
            <small id="document-number-error" class="field__error" aria-live="polite">
              El documento no puede superar los 30 caracteres.
            </small>
          }
        </label>

        <label class="field">
          <span>Teléfono <span class="field__required" aria-hidden="true">*</span></span>
          <input
            type="tel"
            formControlName="phone"
            placeholder="11 4444-5555"
            autocomplete="tel"
            required
            [attr.aria-invalid]="form.controls.phone.touched && form.controls.phone.invalid"
            [attr.aria-describedby]="
              form.controls.phone.touched && form.controls.phone.invalid ? 'phone-error' : null
            "
          />
          @if (form.controls.phone.touched && form.controls.phone.invalid) {
            <small id="phone-error" class="field__error" aria-live="polite">
              @if (form.controls.phone.hasError('required')) {
                El teléfono es obligatorio.
              } @else {
                Ingresá entre 6 y 30 caracteres válidos.
              }
            </small>
          }
        </label>

        <label class="field">
          <span>Email</span>
          <input
            type="email"
            formControlName="email"
            placeholder="cliente@email.com"
            autocomplete="email"
            [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
            [attr.aria-describedby]="
              form.controls.email.touched && form.controls.email.invalid ? 'email-error' : null
            "
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <small id="email-error" class="field__error" aria-live="polite">
              @if (form.controls.email.hasError('email')) {
                El email debe tener el formato usuario@dominio.com.
              } @else {
                El email no puede superar los 255 caracteres.
              }
            </small>
          }
        </label>

        <label class="field">
          <span>Dirección</span>
          <input
            type="text"
            formControlName="address"
            placeholder="Av. Siempre Viva 742"
            autocomplete="street-address"
            [attr.aria-invalid]="form.controls.address.touched && form.controls.address.invalid"
            [attr.aria-describedby]="
              form.controls.address.touched && form.controls.address.invalid
                ? 'address-error'
                : null
            "
          />
          @if (form.controls.address.touched && form.controls.address.invalid) {
            <small id="address-error" class="field__error" aria-live="polite">
              La dirección no puede superar los 255 caracteres.
            </small>
          }
        </label>

        <label class="field field--wide">
          <span>Observaciones</span>
          <textarea
            formControlName="notes"
            rows="4"
            placeholder="Preferencias, aclaraciones o información útil"
            [attr.aria-invalid]="form.controls.notes.touched && form.controls.notes.invalid"
            [attr.aria-describedby]="
              form.controls.notes.touched && form.controls.notes.invalid ? 'notes-error' : null
            "
          ></textarea>
          @if (form.controls.notes.touched && form.controls.notes.invalid) {
            <small id="notes-error" class="field__error" aria-live="polite">
              Las observaciones no pueden superar los 1000 caracteres.
            </small>
          }
        </label>
      </div>

      @if (errorMessage()) {
        <p class="customer-form__error" role="alert">{{ errorMessage() }}</p>
      }

      <div class="customer-form__actions">
        <button class="button button--secondary" type="button" (click)="onCancel()">
          {{ cancelLabel() }}
        </button>
        <button class="button button--primary" type="submit" [disabled]="form.invalid || saving()">
          @if (saving()) {
            Guardando...
          } @else if (isEdit()) {
            Guardar cambios
          } @else {
            <span aria-hidden="true">+</span>
            Registrar cliente
          }
        </button>
      </div>
    </form>
  }
</section>
