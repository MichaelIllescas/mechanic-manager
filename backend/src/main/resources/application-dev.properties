# ============================================================
# Perfil DEV - maquina local.
# Casi todo tiene valor por defecto. Lo unico obligatorio es JWT_SECRET:
# copiar backend/.env.example a backend/.env y completarlo (el archivo explica
# como generarlo). No tiene valor por defecto a proposito: el perfil dev es el
# que se activa si nadie define SPRING_PROFILES_ACTIVE, y una clave conocida
# permitiria fabricar tokens de acceso en un despliegue mal configurado.
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/mechanic_manager}
spring.datasource.username=${DB_USERNAME:mechanic_manager}
spring.datasource.password=${DB_PASSWORD:mechanic_manager_dev}

# Levanta MySQL y phpMyAdmin automaticamente al iniciar la app
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start_only

security.jwt.secret=${JWT_SECRET:}

# Angular dev server
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Sin credenciales SMTP la app arranca igual; solo falla el envio de emails
# (recuperacion de contrasena), y el error queda en el log.
spring.mail.username=${MAIL_USERNAME:dev@mechanicmanager.local}
spring.mail.password=${MAIL_PASSWORD:}
