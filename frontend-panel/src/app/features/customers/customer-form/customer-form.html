<main class="customer-form-page">
  <section class="customer-form-header">
    <a class="customer-form-header__back" routerLink="/customers" aria-label="Volver a clientes">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m15 18-6-6 6-6" />
      </svg>
      Volver
    </a>

    <p class="customer-form-header__eyebrow">Taller</p>
    <h1>{{ isEdit() ? 'Editar cliente' : 'Nuevo cliente' }}</h1>
    <p>
      {{
        isEdit()
          ? 'Actualizá los datos personales y de contacto del cliente.'
          : 'Registrá un cliente para asociarle vehículos, turnos y trabajos.'
      }}
    </p>
  </section>

  @if (errorMessage()) {
    <p class="customer-form-page__error" role="alert">{{ errorMessage() }}</p>
  }

  <app-customer-form-fields
    [customer]="customer()"
    [loading]="loadingCustomer()"
    (saved)="onSaved()"
    (cancelled)="onCancelled()"
  />
</main>
