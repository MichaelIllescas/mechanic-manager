openapi: 3.1.0

info:
  title: Mechanic Manager API
  version: 1.0.0
  description: >
    API REST del micro SaaS de gestión para talleres mecánicos.
    El contrato se completará progresivamente a medida que se implementen
    los endpoints del MVP.

servers:
  - url: /api/v1
    description: Base path de la API

tags:
  - name: Auth
    description: Autenticación y acceso.
  - name: Workshops
    description: Creación y configuración del taller propio del usuario autenticado.
  - name: Users
    description: Administración de cuentas de usuario de la plataforma por SYSTEM_ADMIN.
  - name: Customers
    description: Gestión de clientes.
  - name: Vehicles
    description: Gestión de vehículos.
  - name: Appointments
    description: Agenda y turnos.
  - name: Quotes
    description: Gestión de presupuestos.
  - name: ServiceTypes
    description: Catálogo de servicios que ofrece el taller.
  - name: WorkOrders
    description: Órdenes de trabajo sobre vehículos.
  - name: History
    description: Consulta del historial técnico de vehículos.

paths:
  /customers:
    get:
      tags:
        - Customers
      summary: Listar o buscar clientes
      description: >
        Sin el parámetro search lista los clientes del taller autenticado.
        Con search busca por nombre, apellido, documento, teléfono o email.
      operationId: listCustomers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Texto de búsqueda.
          schema:
            type: string
      responses:
        '200':
          description: Listado obtenido correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Customers
      summary: Registrar un cliente
      operationId: createCustomer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Cliente registrado correctamente.
          headers:
            Location:
              description: URL del cliente registrado.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}:
    put:
      tags:
        - Customers
      summary: Editar un cliente
      description: >
        Solo permite editar un cliente perteneciente al taller del usuario autenticado.
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del cliente.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Cliente actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles:
    get:
      tags:
        - Vehicles
      summary: Listar o buscar vehículos
      description: >
        Sin el parámetro search lista los vehículos del taller autenticado.
        Con search busca por coincidencia parcial de patente.
      operationId: listVehicles
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Patente o parte de ella.
          schema:
            type: string
      responses:
        '200':
          description: Listado obtenido correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Vehicles
      summary: Registrar un vehículo
      description: >
        Registra un vehículo y lo asocia a un cliente del taller autenticado.
      operationId: createVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Vehículo registrado correctamente.
          headers:
            Location:
              description: URL del vehículo registrado.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /vehicles/{id}:
    put:
      tags:
        - Vehicles
      summary: Editar un vehículo
      description: >
        Solo permite editar un vehículo y asociarlo a un cliente perteneciente
        al taller del usuario autenticado.
      operationId: updateVehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del vehículo.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Vehículo actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  responses:
    BadRequest:
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario no tiene permisos para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El recurso solicitado no existe dentro del alcance autenticado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: La operación viola una restricción de unicidad.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CustomerRequest:
      type: object
      required:
        - firstName
        - lastName
        - phone
      properties:
        firstName:
          type: string
          maxLength: 120
          example: Juan
        lastName:
          type: string
          maxLength: 120
          example: Pérez
        documentNumber:
          type:
            - string
            - 'null'
          maxLength: 30
          example: '30111222'
        phone:
          type: string
          minLength: 6
          maxLength: 30
          example: 11 4444-5555
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
          example: juan@email.com
        notes:
          type:
            - string
            - 'null'
          maxLength: 1000
          example: Cliente habitual
    CustomerResponse:
      allOf:
        - $ref: '#/components/schemas/CustomerRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 1
            createdAt:
              type:
                - string
                - 'null'
              format: date-time
            updatedAt:
              type:
                - string
                - 'null'
              format: date-time
    VehicleRequest:
      type: object
      required:
        - customerId
        - licensePlate
        - brand
        - model
        - chassisNumber
        - engineNumber
        - vehicleType
      properties:
        customerId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        licensePlate:
          type: string
          maxLength: 20
          example: AB123CD
        brand:
          type: string
          maxLength: 80
          example: Toyota
        model:
          type: string
          maxLength: 120
          example: Corolla
        year:
          type:
            - integer
            - 'null'
          minimum: 1886
          maximum: 9999
          example: 2020
        chassisNumber:
          type: string
          maxLength: 100
          example: 8AJZZZ12345678901
        engineNumber:
          type: string
          maxLength: 100
          example: 2ZR1234567
        mileage:
          type:
            - integer
            - 'null'
          minimum: 0
          example: 85000
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        notes:
          type:
            - string
            - 'null'
          maxLength: 1000
          example: Realiza los servicios cada 10.000 km
    VehicleResponse:
      allOf:
        - $ref: '#/components/schemas/VehicleRequest'
        - type: object
          required:
            - id
            - customerFirstName
            - customerLastName
          properties:
            id:
              type: integer
              format: int64
              example: 1
            customerFirstName:
              type: string
              example: Juan
            customerLastName:
              type: string
              example: Pérez
            createdAt:
              type:
                - string
                - 'null'
              format: date-time
            updatedAt:
              type:
                - string
                - 'null'
              format: date-time
    VehicleType:
      type: string
      enum:
        - CAR
        - SUV
        - PICKUP
        - VAN
        - TRUCK
        - MOTORCYCLE
        - OTHER
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
